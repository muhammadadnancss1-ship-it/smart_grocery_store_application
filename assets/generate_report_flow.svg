<title id="title">07 / Generate Store Report</title><desc id="desc">Explicit loops calculate totals; one product loop checks low stock and both price extrema.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#52627B"/></marker></defs>
