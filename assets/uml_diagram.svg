<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="title desc">
<title id="title">Application module diagram</title><desc id="desc">The supplied structure: four helper functions and eight inline menu branches.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#52627B"/></marker></defs>
<rect width="1000" height="1240" fill="#FFFFFF"/>
<text x="38" y="44" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">Application module diagram</text>
<text x="38" y="75" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The supplied structure: four helper functions and eight inline menu branches.</text>
<rect x="26" y="100" width="948" height="1050" rx="18" fill="#FFFFFF" stroke="#CCD7E7" stroke-width="1.5"/>
<text x="50" y="130" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">«module»  smart_grocery_store.py</text>
<rect x="50" y="152" width="415" height="155" rx="10" fill="#F5F7FB" stroke="#B7C5D8" stroke-width="1.5"/>
<text x="68" y="180" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">CONSTANTS</text>
<text x="68" y="216" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">MAX_INTEGER_DIGITS = 18</text>
<text x="68" y="245" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">PRICE_DECIMAL_PLACES = 2</text>
<text x="68" y="274" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">LOW_STOCK_THRESHOLD = 5</text>
<rect x="505" y="152" width="445" height="155" rx="10" fill="#ECF4FF" stroke="#AFCCF2" stroke-width="1.5"/>
<text x="523" y="180" fill="#1763BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">IN-MEMORY STATE</text>
<text x="523" y="205" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">products: list of dictionaries</text>
<text x="523" y="225" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">  id, name, category, price, stock</text>
<text x="523" y="245" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">sales: list of dictionaries</text>
<text x="523" y="265" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">  product_id, product_name,</text>
<text x="523" y="285" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">  quantity_sold, total_amount</text>
<rect x="50" y="375" width="280" height="187" rx="12" fill="#F3EDFC" stroke="#CDB7EC" stroke-width="1.5"/>
<text x="68" y="405" fill="#7544BF" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">TOP-LEVEL CONTROL</text>
<text x="68" y="444" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">while True:</text>
<text x="68" y="480" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Read choice; if / elif / else</text>
<text x="68" y="511" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">continue → show menu again</text>
<text x="68" y="540" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">choice 8 → print + break</text>
<rect x="425" y="375" width="525" height="305" rx="12" fill="#EAF8F0" stroke="#A6D8BF" stroke-width="1.5"/>
<text x="445" y="405" fill="#168052" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">INLINE MENU BRANCHES — NOT FUNCTIONS</text>
<text x="445" y="440" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">1  Add New Product</text>
<text x="445" y="469" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">2  View All Products</text>
<text x="445" y="498" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">3  Search Product</text>
<text x="445" y="527" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">4  Update Product Stock</text>
<text x="445" y="556" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">5  Process Customer Sale</text>
<text x="445" y="585" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">6  View Sales Records</text>
<text x="445" y="614" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">7  Generate Store Report</text>
<text x="445" y="643" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">8  Exit</text>
<polyline points="330,466 425,466" fill="none" stroke="#52627B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="332.2421875" y="436" width="87.515625" height="21" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="376" y="451" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">dispatches</text>
<polyline points="725,307 725,375" fill="none" stroke="#52627B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="758.5390625" y="329" width="106.921875" height="21" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="812" y="344" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">reads / writes</text>
<rect x="50" y="820" width="415" height="200" rx="12" fill="#ECF4FF" stroke="#AFCCF2" stroke-width="1.5"/>
<text x="68" y="851" fill="#1763BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">INPUT HELPERS</text>
<text x="68" y="891" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">read_integer(prompt, minimum=0)</text>
<text x="68" y="924" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">read_price()</text>
<text x="68" y="962" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Repeat invalid numeric input with while.</text>
<text x="68" y="991" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Check isdecimal() before conversion.</text>
<rect x="505" y="820" width="445" height="200" rx="12" fill="#F5F7FB" stroke="#B7C5D8" stroke-width="1.5"/>
<text x="523" y="851" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">LOOKUP / DISPLAY HELPERS</text>
<text x="523" y="891" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">find_product(product_id)</text>
<text x="523" y="924" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">display_product(product)</text>
<text x="523" y="962" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Return matching dictionary or None.</text>
<text x="523" y="991" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Display all five product fields.</text>
<polyline points="550,680 550,738 258,738 258,820" fill="none" stroke="#52627B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="299.640625" y="713" width="180.71875" height="21" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="390" y="728" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">choices 1 / 4 / 5: «calls»</text>
<polyline points="790,680 790,820" fill="none" stroke="#52627B" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="812.7578125" y="750" width="60.484375" height="21" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="843" y="765" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">«calls»</text>
<text x="50" y="1070" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The menu runs at file scope and repeats until choice 8 breaks its loop.</text>
<text x="50" y="1105" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Dashed arrows show selected call and shared-state dependencies.</text>
<text x="38" y="1190" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">This procedural program has no application classes or database entities.</text>
</svg>