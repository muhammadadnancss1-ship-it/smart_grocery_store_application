<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370" role="img" aria-labelledby="title desc">
<title id="title">03 / Search Product</title><desc id="desc">IDs are compared as text; complete names are compared using lower().</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#52627B"/></marker></defs>
<rect width="1000" height="1370" fill="#FFFFFF"/>
<text x="38" y="44" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">03 / Search Product</text>
<text x="38" y="75" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">IDs are compared as text; complete names are compared using lower().</text>
<rect x="210.0" y="110.0" width="280" height="44" rx="22.0" fill="#F5F7FB" stroke="#52627B" stroke-width="1.5"/>
<text x="350" y="137.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Start: menu choice 3</text>
