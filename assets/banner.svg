<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Smart Grocery Store Management System</title><desc id="desc">Python console project using loops, functions, dictionaries and validation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#52627B"/></marker></defs>
<rect width="1000" height="260" fill="#FFFFFF"/>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9F3FF"/><stop offset="1" stop-color="#F1EBFF"/></linearGradient></defs>
<rect x="10" y="10" width="980" height="240" rx="20" fill="url(#wash)" stroke="none" stroke-width="1.5"/>
<text x="34" y="43" fill="#1763BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">PYTHON CONSOLE PROJECT</text>
<text x="34" y="90" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Smart Grocery Store</text>
<text x="34" y="129" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Management System</text>
<text x="34" y="162" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Track products, manage stock and record sales.</text>
<rect x="34" y="197" width="89" height="28" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="78.5" y="215" fill="#1763BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOOPS</text>
<rect x="132" y="197" width="116" height="28" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="190.0" y="215" fill="#7544BF" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FUNCTIONS</text>
<rect x="257" y="197" width="124" height="28" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="319.0" y="215" fill="#168052" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DICTIONARIES</text>
<rect x="390" y="197" width="120" height="28" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="450.0" y="215" fill="#9D6200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VALIDATION</text>
<rect x="612" y="32" width="354" height="196" rx="14" fill="#15233C" stroke="none" stroke-width="1.5"/>
<circle cx="632" cy="49" r="4" fill="#EF6A73"/>
<circle cx="648" cy="49" r="4" fill="#EFC56B"/>
<circle cx="664" cy="49" r="4" fill="#71CD9D"/>
<text x="689" y="53" fill="#ADBED7" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">smart_grocery_store.py</text>
<text x="630" y="86" fill="#D9B7FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">if </text>
<text x="641.359375" y="86" fill="#E5EEFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">quantity &lt;= stock:</text>
<text x="630" y="108" fill="#E5EEFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">    total </text>
<text x="676.5" y="108" fill="#D9B7FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">= </text>
<text x="690.375" y="108" fill="#A4D6FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">price * quantity</text>
<text x="630" y="130" fill="#E5EEFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">    stock </text>
<text x="680.90625" y="130" fill="#D9B7FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">-= </text>
<text x="699.109375" y="130" fill="#A4D6FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">quantity</text>
<text x="630" y="152" fill="#97E6BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">    sales.append(record)</text>
<text x="630" y="174" fill="#D9B7FF" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">else:</text>
<text x="630" y="196" fill="#FFD293" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">    print(&quot;Insufficient stock&quot;)</text>
</svg>