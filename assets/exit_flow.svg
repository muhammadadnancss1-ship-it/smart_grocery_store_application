<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">08 / Exit and Menu Control</title><desc id="desc">The outer while loop ends only when choice 8 reaches break.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#52627B"/></marker></defs>
<rect width="1000" height="1000" fill="#FFFFFF"/>
<text x="38" y="44" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">08 / Exit and Menu Control</text>
<text x="38" y="75" fill="#52627B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The outer while loop ends only when choice 8 reaches break.</text>
<rect x="185.0" y="110.0" width="330" height="44" rx="22.0" fill="#F5F7FB" stroke="#52627B" stroke-width="1.5"/>
<text x="350" y="137.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Start / next menu iteration</text>
<polygon points="178.0,200.0 540.0,200.0 522.0,280.0 160.0,280.0" fill="#ECF4FF" stroke="#1763BC" stroke-width="1.6"/>
<text x="350" y="245.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Display menu; read and trim choice</text>
<polygon points="350,332.0 540.0,390 350,448.0 160.0,390" fill="#F3EDFC" stroke="#7544BF" stroke-width="1.6"/>
<text x="350" y="395.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Choice is 8?</text>
<rect x="160.0" y="525.0" width="380" height="70" rx="12" fill="#EAF8F0" stroke="#168052" stroke-width="1.5"/>
<text x="350" y="565.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Print Goodbye!</text>
<rect x="160.0" y="655.0" width="380" height="70" rx="12" fill="#F5F7FB" stroke="#52627B" stroke-width="1.5"/>
<text x="350" y="695.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">break the menu loop</text>
<rect x="250.0" y="828.0" width="200" height="44" rx="22.0" fill="#F5F7FB" stroke="#52627B" stroke-width="1.5"/>
<text x="350" y="855.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">End</text>
<polygon points="810,337.0 950.0,390 810,443.0 670.0,390" fill="#F3EDFC" stroke="#7544BF" stroke-width="1.6"/>
<text x="810" y="395.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Choice 1–7?</text>
<rect x="670.0" y="520.0" width="280" height="80" rx="12" fill="#F5F7FB" stroke="#52627B" stroke-width="1.5"/>
<text x="810" y="565.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Run selected operation</text>
<rect x="670.0" y="705.0" width="280" height="70" rx="12" fill="#FFF0F1" stroke="#BC3744" stroke-width="1.5"/>
<text x="810" y="745.78" fill="#172B4D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Print Invalid choice.</text>
